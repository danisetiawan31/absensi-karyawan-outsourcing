services:
  postgres:
    image: postgres:16
    container_name: absensi_postgres
    environment:
      POSTGRES_USER: absensi
      POSTGRES_PASSWORD: absensi_password
      POSTGRES_DB: absensi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
