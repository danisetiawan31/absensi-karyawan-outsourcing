name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build (Monorepo)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absensi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/absensi_test?schema=public"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      JWT_SECRET: "ci-test-jwt-secret-key-32-characters-min!!"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-key-32-chars!!"
      PORT: 3000
      TZ: "Asia/Jakarta"
      SKIP_FACE_VERIFICATION: "true"
      FACE_SERVICE_TIMEOUT_MS: "40000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Database Schema (Prisma)
        run: |
          npx prisma generate --schema=apps/backend/prisma/schema.prisma
          npx prisma db push --schema=apps/backend/prisma/schema.prisma --skip-generate

      - name: Run Linting (Turborepo)
        run: npx turbo run lint

      - name: Run Automated Tests (Turborepo)
        run: npx turbo run test

      - name: Run Build (Turborepo)
        run: npx turbo run build
